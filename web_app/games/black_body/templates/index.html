<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summer of Science: EXPTECH - Black Body</title>
    <link rel="icon" type="image/jpeg" href="/static/favicon.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/games/black_body/static/style.css" />
  </head>

  <body class="page-center">
    <!-- JOIN SCREEN -->
    <div class="join-card" id="joinCard">
      <a class="back-link" href="/">← All games</a>
      <span class="eyebrow">Summer of Science · EXPTECH</span>
      <h1>Black Body</h1>

      <p class="sub">
        Assuming the Sun is a black body, how hot is the exterior of the Sun?
      </p>
      <input
        type="text"
        id="nameInput"
        placeholder="Your name"
        maxlength="18"
      />
      <button class="btn-primary" id="joinBtn">Join &amp; Play</button>
      <button class="btn-ghost" id="watchBtn">Just watching</button>
    </div>

    <!-- GAME SCREEN -->
    <div class="stage" id="stage">
      <a class="back-link" href="/">← All games</a>
      <div class="topbar">
        <span class="title">Black Body</span>
        <div class="who" id="whoLine"></div>
      </div>

      <div class="grid">
        <section class="panel" id="dialPanel">
          <h2>Your Dial</h2>

          <div id="canvasWrap">
            <canvas id="scene" width="470" height="200"></canvas>
          </div>

          <div class="readout">
            <div class="readout-item">
              <output class="score-num mono" id="wave-read">0</output>
              <span class="score-label">WAVELENGTH (nm)</span>
            </div>
            <div class="readout-item">
              <output class="score-num mono" id="score">0</output>
              <span class="score-label">SCORE</span>
            </div>
          </div>

          <div class="settings">
            <div class="setting">
              <label for="tempSpinBox" class="observable-label">
                <strong>Temperature</strong> (K)
              </label>
              <input
                type="number"
                id="tempSpinBox"
                name="temp"
                min="0"
                value="300"
                step="100"
              />
            </div>
          </div>
        </section>

        <!-- LEADERBOARD -->
        <section class="panel">
          <h2>Live Leaderboard</h2>

          <div id="board">
            <div class="empty-state">Waiting for players…</div>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="/games/black_body/static/game.js"></script>
  </body>
</html>
